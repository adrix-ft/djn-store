  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="DJN Tech – Online Gaming Store for Consoles, Controllers & Pre-Owned Games" />
    <meta property="og:description" content="DJN Tech is an online gaming store in India offering PS5 & PS4 consoles, official controllers, and tested pre-owned games with 7-day replacement and free delivery above ₹1000." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#1a73e8" />

    <!-- Preconnect & DNS-Prefetch for Critical CDNs & Supabase -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <link rel="dns-prefetch" href="https://shared.akamai.steamstatic.com" />
    <link rel="preconnect" href="https://rudqiwifokllmjpfcnbp.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://rudqiwifokllmjpfcnbp.supabase.co" />

    <!-- Preload Largest Contentful Paint (LCP) Hero Image -->
    <link rel="preload" as="image" href="/hero-ps5-slim.png" fetchpriority="high" type="image/png" />

    <!-- Modern Optimized Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Elfsight Google Reviews CDN & Early Watermark Suppressor -->
    <script>
      (function() {
        var origAttachShadow = Element.prototype.attachShadow;
        if (origAttachShadow) {
          Element.prototype.attachShadow = function(init) {
            var shadow = origAttachShadow.call(this, init);
            try {
              var style = document.createElement('style');
              style.textContent = [
                'a[href*="elfsight.com"],',
                'a[href*="free-widget"],',
                'a[href*="utm_campaign"],',
                '[class*="Badge"],',
                '[class*="badge"],',
                '[class*="Watermark"],',
                '[class*="watermark"],',
                '[class*="eapps-link"],',
                '[class*="OwnerPanel"],',
                '[class*="owner-panel"],',
                '[class*="WidgetToolbar"],',
                '[class*="toolbar"] {',
                '  display: none !important;',
                '  opacity: 0 !important;',
                '  visibility: hidden !important;',
                '  height: 0 !important;',
                '  width: 0 !important;',
                '  max-height: 0 !important;',
                '  max-width: 0 !important;',
                '  pointer-events: none !important;',
                '  position: absolute !important;',
                '  top: -9999px !important;',
                '  left: -9999px !important;',
                '  overflow: hidden !important;',
                '}'
              ].join('\n');
              shadow.appendChild(style);
            } catch (e) {}
            return shadow;
          };
        }

        function walkAndPurge(node) {
          if (!node) return;
          try {
            if (node.querySelectorAll) {
              var links = node.querySelectorAll('a[href*="elfsight.com"], a[href*="free-widget"], [class*="eapps-link"]');
              for (var i = 0; i < links.length; i++) {
                links[i].style.setProperty('display', 'none', 'important');
                links[i].style.setProperty('visibility', 'hidden', 'important');
                links[i].style.setProperty('height', '0', 'important');
                try { links[i].remove(); } catch(e) {}
              }
              var all = node.querySelectorAll('*');
              for (var j = 0; j < all.length; j++) {
                if (all[j].shadowRoot) {
                  walkAndPurge(all[j].shadowRoot);
                }
              }
            }
          } catch(e) {}
        }

        var interval = setInterval(function() {
          walkAndPurge(document);
        }, 150);

        setTimeout(function() {
          clearInterval(interval);
          setInterval(function() { walkAndPurge(document); }, 1000);
        }, 20000);
      })();
    </script>
    <script src="https://elfsightcdn.com/platform.js" async></script>
  </head>
  <body class="bg-white text-[#212121] antialiased selection:bg-[#1a73e8] selection:text-white min-h-screen">

  </body>
</html>
